<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" autocomplete="off" >
        <fieldset>
            <legend>form</legend>
        <label>first name : </label>
        <input name="firstName" placeholder="enter first name" required> <br>
        <label>last name : </label>
        <input placeholder="enter last name">
        
        <div>
        <label for=""> email </label>
        <input type="email" name="email">
        </div>
        <label for="">Gender</label>
        <input type="radio" name="gender" value="male">  <label>male</label>
        <input type="radio" name="gender" value="female">  <label>female</label>

        <!-- mobile -->
         <label>Mobile:</label>
         <input type="text" pattern="01(0|1|2|5)[0-9]{8}" maxlength="11" required>
        <div>
            <label for="">Age</label>
            <input type="number" name="userAge" min="5" max="10">
        </div>
    
        <label for="">course</label>
<input type="checkbox" value="html"> <label>HTML</label>
<input type="checkbox" value="CSS"> <label>CSS</label>
<input type="checkbox" value="JS"> <label>JS</label>
<br>

<select name="track" id="">
    <option value="10" disabled selected>please choose</option>
    <option value="0">frontend</option>

</select>

<!-- file -->
<input type="file" name="userfile" multiple accept=".png">

<input type="text" pattern="[A-Za-z]" title="enter only letters">

<label for="website">homepage</label>
<input type="url" id="website" name="website" pattern="https?://.+" title="include http://">
<div>
    <input type="date" name="userdata">
    <input type="datetime-local"> 
</div>

<input type="color">
<input type="range" min="10" max="100">
<br>
<label for="">ID</label>
<input type="text" minlength="2" maxlength="14">

<!-- datalist -->
<div>
    <label>countries:</label>
<input type="search" list="countries">
<datalist id="countries">
    <option value="Egypt">
    <option value="USA">
    <option value="France">
</datalist>
</div>

<div>
    <textarea name="" id="" placeholder="enter your comment" cols="3" rows="4"></textarea>
</div>

<div>
        <input type="submit" value="login">
        <button>Register</button>
        <button>clear</button>

</div>
        </fieldset>
    </form>
</body>
</html>
